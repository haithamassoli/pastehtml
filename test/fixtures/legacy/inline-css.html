<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>Inline CSS</title>
<style type="text/css">
  body { background: #fffbe6; font-family: Verdana, Geneva, sans-serif; }
  .box { border: 1px solid #cc0000; padding: 8px; margin: 0 auto; width: 60%; }
  a:hover { text-decoration: underline; }
  @media print { .box { border: none; } }
</style>
</head>
<body bgcolor="#fffbe6">
<!-- a page of the kind the old app served for years -->
<div class="box" style="color: #333; text-align: center">
  <h1 style="margin:0">Inline CSS survives</h1>
  <p style='font-style: italic'>Single quotes in an attribute, too.</p>
</div>
</body>
</html>
