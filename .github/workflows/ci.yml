name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          # Placeholder values so env validation + build succeed in CI.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci-placeholder
          CLERK_SECRET_KEY: sk_test_ci-placeholder
